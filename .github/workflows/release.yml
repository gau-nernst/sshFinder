# Pushing a tag like v0.1.0 builds the app and publishes it as a release.
# Running it by hand (Actions → Release → Run workflow) only builds, and keeps
# the zip as a downloadable artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/bundle.sh
          ditto -c -k --keepParent build/sshFinder.app sshFinder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sshFinder
          path: sshFinder.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sshFinder.zip --title "$GITHUB_REF_NAME" --generate-notes
